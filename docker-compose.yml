services:
  db:
    image: mysql:8.0.32
    container_name: greenlight_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenlight_db
      MYSQL_USER: greenlight
      MYSQL_PASSWORD: greenlight
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - intranet

  minio:
    image: minio/minio:latest
    container_name: greenlight_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # MinIO API
      - "9001:9001"  # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - intranet

  # MinIO setup service - configures bucket and CORS
  minio-setup:
    image: minio/mc:latest
    container_name: greenlight_minio_setup
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: greenlight
    volumes:
      - ./scripts/minio-setup.sh:/setup.sh:ro
      - ./minio:/cors-config:ro
    entrypoint: /bin/sh
    command: /setup.sh
    networks:
      - intranet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenlight_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: greenlight_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE_HOURS: 1
      CORS_ORIGINS: "*"
      UPLOAD_DIR: /root/uploads
      MAX_UPLOAD_SIZE: 10485760
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: greenlight
      MINIO_USE_SSL: false
      MINIO_PUBLIC_URL: http://localhost:9000
      LOG_LEVEL: info
    volumes:
      - ./uploads:/root/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - intranet

volumes:
  db_data:
    driver: local
  minio_data:
    driver: local

networks:
  intranet:

