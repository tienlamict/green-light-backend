services:
  db:
    image: mysql:8.0.32
    container_name: greenlight_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --skip-ssl
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: greenlight_db
      MYSQL_USER: greenlight
      MYSQL_PASSWORD: greenlight
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - intranet

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenlight_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: greenlight_db
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE_HOURS: 1
      CORS_ORIGINS: "*"
      UPLOAD_DIR: /root/uploads
      MAX_UPLOAD_SIZE: 10485760
      LOG_LEVEL: info
    volumes:
      - ./uploads:/root/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - intranet

volumes:
  db_data:
    driver: local

networks:
  intranet:

